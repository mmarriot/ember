# The checks that need nothing from CERN: the Python tests (converter, format, command, site: synthetic NanoAOD and
# stand-ins for xrdcp and cmsDriver) and the viewer's type check, unit tests (they read golden/v6_1event.ember) and
# build.
# The browser checks (viewer/e2e/smoke.mjs) need a development server and bundles in data/, and are run by hand.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    # Not ubuntu-latest: setup-python has no Python 3.9 for Ubuntu 26.04, which ubuntu-latest became in November 2026.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The oldest Python that ember supports (lxplus and CMSSW have it), and a recent one.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test,dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: python3 -m pytest tests
      - run: for f in service/*.sh; do bash -n "$f"; done # the deployment and cron scripts: syntax only
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build # what only bundling resolves, e.g. the decompression worker's URL
