# The documentation site: docs/*.md built by Zensical (https://zensical.org) and published to GitHub Pages by
# .github/workflows/docs.yml. Preview locally with `zensical serve`.

[project]
site_name = "evd"
site_description = "Web event display for CMS: events written by CMSSW as NanoAOD tables, turned into a link by one command and drawn in the browser"
site_url = "https://mmarriot.github.io/evd/"
# A new page in docs/ needs its line here, or the site has no way to it.
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "The evd command" = "cli.md" },
  { "CMSSW side" = "cmssw.md" },
  { "Viewer" = "viewer.md" },
  { "Truth" = "truth.md" },
  { "Truth graph" = "truth-graph.md" },
  { "Profiles" = "profiles.md" },
  { "Bundle format" = "format.md" },
  { "Hosting" = "hosting.md" },
  { "Questions and problems" = "faq.md" },
]

# Setting this table replaces Zensical's default extensions (smartsymbols, magiclink, ...), so the pages render as on
# GitHub: e.g. -> and <-> stay as written. Tables and fenced code are always on.
[project.markdown_extensions]
# Heading ids as GitHub makes them, so a link like viewer.md#colours-and-the-truth--reco-pair works both on the
# site and when the file is read on GitHub.
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
