# The documentation site: docs/*.md built by Zensical (https://zensical.org) and published to GitHub Pages by
# .github/workflows/docs.yml. Preview locally with `zensical serve`.

[project]
site_name = "Ember"
site_description = "A web event display for CMS: one command turns a CMSSW output file into a link, and the browser draws the event"
site_url = "https://mmarriot.github.io/ember/"
# A new page in docs/ needs its line here, or the site has no way to it. The menu is ordered by what a reader needs:
# the tutorial, then recipes and common questions, then reference, then the background on truth, then the site's
# operators.
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "How-to guides" = "how-to.md" },
  { "Questions and problems" = "faq.md" },
  { "Reference" = [
    { "The ember command" = "cli.md" },
    { "Viewer" = "viewer.md" },
    { "CMSSW side" = "cmssw.md" },
    { "Profiles" = "profiles.md" },
    { "Bundle format" = "format.md" },
  ] },
  { "Truth" = [
    { "How truth is shown" = "truth.md" },
    { "The truth graph" = "truth-graph.md" },
  ] },
  { "Hosting the site" = "hosting.md" },
]

# Setting this table replaces Zensical's default extensions (smartsymbols, magiclink, ...), so the pages render as on
# GitHub: e.g. -> and <-> stay as written. Tables and fenced code are always on.
[project.markdown_extensions]
# Heading ids as GitHub makes them, so a link like viewer.md#colours-and-the-truth--reco-pair works both on the
# site and when the file is read on GitHub.
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
